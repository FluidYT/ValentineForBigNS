<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Be My Valentine?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <div class="hearts" aria-hidden="true"></div>

    <h1>Will you be my Valentine? 💘</h1>
    <p class="subtitle" id="subtitle">I promise snacks and unlimited glazing.</p>

    <div class="buttons">
      <button id="yesBtn" class="btn yes">Yes 💖</button>
      <button id="noBtn" class="btn no">No 🙃</button>
    </div>

    <section class="result" id="result" hidden>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <div class="actions">
        <button class="btn secondary" id="confettiBtn">More confetti ✨</button>
        <button class="btn secondary" id="copyBtn">Copy link 🔗</button>
      </div>
    </section>

    <footer class="footer">Made with suspicious amounts of love.</footer>
  </main>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="script.js"></script>
</body>
</html>
